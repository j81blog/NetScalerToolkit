site_name: NetScalerToolkit
site_description: PowerShell automation for Citrix NetScaler NITRO and ACME certificate workflows.
repo_url: https://github.com/j81blog/NetScalerToolkit
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - minify:
      minify_html: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

validation:
  nav:
    omitted_files: ignore

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Module:
      - Overview: module/overview.md
      - Sessions: module/sessions.md
      - Generated Functions: module/generated-functions.md
      - Reference: module/reference/index.md
  - Certificates:
      - Introduction: certificates/overview.md
      - Staging And Production: certificates/staging-production.md
      - ACME How It Works: certificates/acme-how-it-works.md
      - Scenario Matrix: certificates/scenario-matrix.md
      - Certificate Deployment: certificates/deployment.md
      - Renewal Behavior: certificates/renewal-behavior.md
      - SAN Certificate: certificates/san-certificate.md
      - HTTP-01 Through NetScaler: certificates/http-01.md
      - HTTP-01 With LB VIP: certificates/http-lb-vip.md
      - DNS-01 With Posh-ACME: certificates/dns-poshacme.md
      - Alternative ACME Providers: certificates/alternative-acme-providers.md
      - Wildcard Certificates: certificates/wildcard-certificates.md
      - DNS-01 Hosted On NetScaler: certificates/netscaler-dns.md
      - tlsserver Profile: certificates/tlsserver-profile.md
      - Config File And AutoRun: certificates/config-file-autorun.md
      - Global VPN Binding: certificates/global-vpn-binding.md
      - Local IIS Binding: certificates/iis-binding.md
      - Post-Run Actions: certificates/post-run-actions.md
      - Legacy Wrapper: certificates/legacy-wrapper.md
      - API User Bootstrap: certificates/api-user-bootstrap.md
      - Cleanup: certificates/cleanup.md
      - Operations Runbooks: certificates/runbooks.md
      - Troubleshooting: certificates/troubleshooting.md
  - Documentation Info: docs-info.md
